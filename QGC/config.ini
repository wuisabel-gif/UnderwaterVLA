[Connection]
# Connection settings
connection_type = udp
# For UDP connections (direct link to the ROV)
udp_host = 127.0.0.1
udp_port = 14445
# For serial connections
serial_port = COM3
baud_rate = 115200

[Control]
# Control parameters
control_frequency = 10  # Hz
max_throttle = 100      # max throttle percentage
max_yaw_rate = 45       # max yaw rate (deg/s)
max_pitch_angle = 30    # max pitch angle (deg)
max_roll_angle = 30     # max roll angle (deg)

[AutoControl]
# Automatic control parameters
enable_depth_hold = true
target_depth = -2.0     # target depth (m)
depth_tolerance = 0.1   # depth tolerance (m)
enable_heading_hold = true
target_heading = 0      # target heading (deg)
heading_tolerance = 5   # heading tolerance (deg)

[Safety]
# Safety parameters
emergency_stop_timeout = 5.0  # emergency stop timeout (s)
max_depth = -10.0             # maximum depth limit (m)
min_depth = -0.5              # minimum depth limit (m)
